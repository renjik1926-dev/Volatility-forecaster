# Uses the project's own pinned tools through uv, so versions match CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: privacy-check
        name: privacy check (data/ and site/ if present)
        entry: bash -c 'paths=(); for p in data site; do [ -e "$p" ] && paths+=("$p"); done; [ ${#paths[@]} -eq 0 ] || uv run --no-sync volforecast privacy-check "${paths[@]}"'
        language: system
        pass_filenames: false
