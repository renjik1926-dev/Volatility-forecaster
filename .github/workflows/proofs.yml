# Weekly OpenTimestamps upgrades (§14): complete pending proofs once they are anchored in
# Bitcoin, commit them to the forecasts branch, then check every forecast row is covered.
name: proofs

on:
  schedule:
    - cron: "53 7 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: forecasts-branch
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The write token isn't kept by the checkout while the proof code runs; only the push gets it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: forecasts
          path: forecasts
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen --no-dev --extra proofs

      - name: Upgrade pending proofs
        env:
          VOLFORECAST_PUBLIC_DIR: forecasts/data
        run: uv run --no-sync volforecast upgrade-proofs

      - name: Commit completed proofs
        working-directory: forecasts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proofs
          if ! git diff --cached --quiet; then
            git commit -m "proofs: upgrade $(date -u +%Y-%m-%d)"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:forecasts
          fi

      - name: Verify every forecast is covered by a stamped file
        env:
          VOLFORECAST_PUBLIC_DIR: forecasts/data
        run: uv run --no-sync volforecast verify-proofs
